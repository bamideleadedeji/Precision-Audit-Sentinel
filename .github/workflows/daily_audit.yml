name: Daily Audit Scout

on:
  schedule:
    - cron: '0 8 * * *' # Runs every morning at 8:00 AM
  workflow_dispatch:   # Manual trigger switch activated

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'

      - name: Install Data Architecture Packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pypdf

      - name: Run Sentinel
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python sentinel_processor.py
