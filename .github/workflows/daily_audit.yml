name: Daily Audit Scout

on:
  schedule:
    - cron: '0 8 * * *' # Runs every morning at 8:00 AM
  workflow_dispatch:   # Manual trigger switch activated

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v3

      - name: Set up Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Data Architecture Packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pypdf

      - name: Run Sentinel Forensic Processing Core
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python sentinel_processor.py

      - name: Archive Forensic Audit Matrix Output
        uses: actions/upload-artifact@v4
        with:
          name: forensic-audit-export
          path: "*.csv"
